apiVersion: v1
kind: ConfigMap
metadata:
  name: apache-config
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kubernetes Apache Server</title>
        <style>
            body { 
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
                text-align: center; 
                margin-top: 50px; 
                background-color: #f4f4f9; 
                color: #333;
            }
            h1 { color: #326ce5; font-size: 3em; margin-bottom: 0.2em; }
            h2 { color: #555; }
            .container { 
                background-color: white; 
                padding: 40px; 
                border-radius: 12px; 
                box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
                display: inline-block;
                max-width: 600px;
            }
            .info { 
                font-size: 1.2em; 
                color: #555; 
                text-align: left;
                background: #eef2f8;
                padding: 20px;
                border-radius: 8px;
                margin-top: 20px;
            }
            .info p { margin: 10px 0; }
            .success-text { color: #28a745; font-weight: bold; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>⎈ Kubernetes</h1>
            <h2><span class="success-text">Kubernetes Apache Server Successfully Running</span></h2>
            
            <div class="info">
                <p><strong>Student Name:</strong> Avi S Gupta</p>
                <p><strong>Roll Number:</strong> 23070122060</p>
                <p><strong>Current Assignment:</strong> Create Apache2 server within a Deployment and access it from the host machine using Kubernetes commands.</p>
            </div>
        </div>
    </body>
    </html>
