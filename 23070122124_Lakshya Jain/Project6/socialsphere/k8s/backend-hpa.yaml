apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: socialsphere-backend
  namespace: socialsphere

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: socialsphere-backend

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60