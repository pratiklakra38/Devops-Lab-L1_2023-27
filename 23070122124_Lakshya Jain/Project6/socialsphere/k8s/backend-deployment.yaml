apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialsphere-backend
  namespace: socialsphere
spec:
  replicas: 2

  selector:
    matchLabels:
      app: socialsphere-backend

  template:
    metadata:
      labels:
        app: socialsphere-backend

    spec:
      containers:
        - name: backend
          image: socialsphere-backend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3001

          envFrom:
            - configMapRef:
                name: socialsphere-backend-config

            - secretRef:
                name: socialsphere-backend-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10