apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialsphere-frontend
  namespace: socialsphere
spec:
  replicas: 2

  selector:
    matchLabels:
      app: socialsphere-frontend

  template:
    metadata:
      labels:
        app: socialsphere-frontend

    spec:
      containers:
        - name: frontend
          image: socialsphere-frontend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"