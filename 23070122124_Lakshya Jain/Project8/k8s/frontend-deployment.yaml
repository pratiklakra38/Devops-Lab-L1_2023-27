apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: project8
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 31781
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        # Optional readiness/liveness probe using the /health endpoint
        readinessProbe:
          httpGet:
            path: /health
            port: 31781
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 31781
          initialDelaySeconds: 15
          periodSeconds: 20
