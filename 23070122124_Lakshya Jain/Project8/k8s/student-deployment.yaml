apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-service
  namespace: project8
  labels:
    app: student-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-service
  template:
    metadata:
      labels:
        app: student-service
    spec:
      containers:
      - name: student-service
        image: student-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 31782
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
