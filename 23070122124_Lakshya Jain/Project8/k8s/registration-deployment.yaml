apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
  namespace: project8
  labels:
    app: registration-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: registration-service
  template:
    metadata:
      labels:
        app: registration-service
    spec:
      containers:
      - name: registration-service
        image: registration-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 31784
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
