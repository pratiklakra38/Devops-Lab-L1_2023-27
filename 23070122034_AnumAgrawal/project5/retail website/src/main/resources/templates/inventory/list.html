<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Inventory')}"></head>
<body>
    
    <nav th:replace="~{layout :: sidebar('inventory')}"></nav>

    <div class="main-content">
        <header th:replace="~{layout :: top-header}"></header>

        <div class="container-fluid p-0">
            <h2 class="mb-4 text-dark font-weight-bold">Inventory Tracking</h2>
            
            <div class="table-container">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Location</th>
                            <th>Product Name</th>
                            <th>SKU</th>
                            <th>Quantity</th>
                            <th>Status</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="inv : ${inventories}">
                            <td th:text="${inv.warehouseLocation}">WH-1</td>
                            <td th:text="${inv.product.name}">Product</td>
                            <td th:text="${inv.product.sku}">SKU</td>
                            <td th:text="${inv.quantity}">100</td>
                            <td>
                                <span th:if="${inv.quantity <= inv.minimumStockLevel}" class="badge bg-danger">Low Stock</span>
                                <span th:if="${inv.quantity > inv.minimumStockLevel}" class="badge bg-success">In Stock</span>
                            </td>
                            <td th:text="${#temporals.format(inv.lastUpdated, 'dd-MM-yyyy HH:mm')}">Date</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(inventories)}">
                            <td colspan="6" class="text-center py-4 text-muted">No inventory records found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
