<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Retail Management System'"></title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Sidebar Fragment -->
    <nav th:fragment="sidebar(activeLink)" class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-store me-2"></i> Retail Admin
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeLink == 'dashboard' ? 'active' : ''}" th:href="@{/}">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeLink == 'products' ? 'active' : ''}" th:href="@{/products}">
                    <i class="fas fa-box"></i> Products
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeLink == 'inventory' ? 'active' : ''}" th:href="@{/inventory}">
                    <i class="fas fa-warehouse"></i> Inventory
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeLink == 'orders' ? 'active' : ''}" th:href="@{/orders}">
                    <i class="fas fa-shopping-cart"></i> Orders
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeLink == 'customers' ? 'active' : ''}" th:href="@{/customers}">
                    <i class="fas fa-users"></i> Customers
                </a>
            </li>
            <li class="nav-item mt-5">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="nav-link border-0 bg-transparent w-100 text-start text-danger">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </form>
            </li>
        </ul>
    </nav>

    <!-- Top Header Fragment -->
    <header th:fragment="top-header" class="top-header">
        <div>
            <h4 class="mb-0 text-dark">Retail Management System</h4>
        </div>
        <div class="user-profile d-flex align-items-center">
            <span class="me-3 fw-bold text-muted" sec:authentication="name">Admin User</span>
            <img src="https://ui-avatars.com/api/?name=Admin&background=4361ee&color=fff" alt="User" class="rounded-circle" width="40">
        </div>
    </header>

    <!-- Scripts Fragment -->
    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </div>

</body>
</html>
