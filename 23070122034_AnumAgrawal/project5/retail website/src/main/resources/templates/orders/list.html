<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Orders')}"></head>
<body>
    
    <nav th:replace="~{layout :: sidebar('orders')}"></nav>

    <div class="main-content">
        <header th:replace="~{layout :: top-header}"></header>

        <div class="container-fluid p-0">
            <h2 class="mb-4 text-dark font-weight-bold">Order Management</h2>
            
            <div class="table-container">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Status</th>
                            <th>Total Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td th:text="${'ORD-' + order.id}">ORD-1</td>
                            <td th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">Date</td>
                            <td th:text="${order.user.username}">Customer</td>
                            <td>
                                <span class="badge bg-primary" th:text="${order.status}">PENDING</span>
                            </td>
                            <td th:text="${'$' + order.totalAmount}">$0.00</td>
                            <td>
                                <button class="btn btn-sm btn-info text-white"><i class="fas fa-eye"></i> View</button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="6" class="text-center py-4 text-muted">No orders found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
