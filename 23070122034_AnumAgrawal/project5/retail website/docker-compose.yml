version: '3.8'

services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=retail_db
      - DB_USER=retail_user
      - DB_PASSWORD=retail_pass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - retail-network

  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=retail_db
      - MYSQL_USER=retail_user
      - MYSQL_PASSWORD=retail_pass
      - MYSQL_ROOT_PASSWORD=root_pass
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail-network

volumes:
  db-data:

networks:
  retail-network:
    driver: bridge
