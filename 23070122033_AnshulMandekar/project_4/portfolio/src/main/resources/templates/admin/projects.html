<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Projects')}"></head>
<body>
    <div class="particles-bg"></div>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container-fluid" style="padding-top: 80px;">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block admin-sidebar glass-panel mt-3 ms-3 py-4">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link admin-nav-link" th:href="@{/admin/dashboard}"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link admin-nav-link active" th:href="@{/admin/projects}"><i class="fas fa-project-diagram me-2"></i> Projects</a></li>
                        <li class="nav-item"><a class="nav-link admin-nav-link" th:href="@{/admin/skills}"><i class="fas fa-code me-2"></i> Skills</a></li>
                        <li class="nav-item"><a class="nav-link admin-nav-link" th:href="@{/admin/messages}"><i class="fas fa-envelope me-2"></i> Messages</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom border-secondary">
                    <h1 class="h2">Manage Projects</h1>
                    <a th:href="@{/admin/projects/add}" class="btn btn-primary"><i class="fas fa-plus me-2"></i>Add Project</a>
                </div>

                <div th:if="${success}" class="alert alert-success alert-dismissible fade show bg-success bg-opacity-25 text-success border-success" role="alert">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="glass-panel p-4">
                    <div class="table-responsive">
                        <table class="table table-glass table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Tech Stack</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="project : ${projects}">
                                    <td th:text="${project.id}">1</td>
                                    <td th:text="${project.title}">Title</td>
                                    <td th:text="${project.technologyStack}">Tech</td>
                                    <td>
                                        <a th:href="@{/admin/projects/edit/{id}(id=${project.id})}" class="btn btn-sm btn-info text-white"><i class="fas fa-edit"></i></a>
                                        <a th:href="@{/admin/projects/delete/{id}(id=${project.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')"><i class="fas fa-trash"></i></a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(projects)}">
                                    <td colspan="4" class="text-center text-muted">No projects found.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
