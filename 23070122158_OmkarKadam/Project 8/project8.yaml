# ============================================================
# PROJECT 8 - COMPLETE MICROSERVICE APPLICATION
# 4 Microservices:
# 1. Frontend
# 2. Backend
# 3. Flask
# 4. Redis
#
# Also includes:
# - ConfigMaps
# - Secret
# - Deployments
# - Services
# - NGINX reverse proxy
# ============================================================


# ============================================================
# CONFIGMAP
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: "development"
  REDIS_HOST: "project8-redis-service"
  REDIS_PORT: "6379"

---
# ============================================================
# SECRET
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  APP_USERNAME: "admin"
  APP_PASSWORD: "password123"

---
# ============================================================
# NGINX CONFIGURATION
# Frontend NGINX will proxy /api/ requests to the backend
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    server {
      listen 80;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location /api/ {
        proxy_pass http://project8-backend-service:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }

---
# ============================================================
# FRONTEND DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: project8-frontend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: project8-frontend

  template:
    metadata:
      labels:
        app: project8-frontend

    spec:
      containers:
        - name: frontend
          image: nginx:latest

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: app-config

            - secretRef:
                name: app-secret

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

---
# ============================================================
# FRONTEND SERVICE
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: project8-frontend-service
spec:
  type: NodePort

  selector:
    app: project8-frontend

  ports:
    - port: 80
      targetPort: 80

---
# ============================================================
# BACKEND DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: project8-backend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: project8-backend

  template:
    metadata:
      labels:
        app: project8-backend

    spec:
      containers:
        - name: backend
          image: ohmschrodinger/backend:v1

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: app-config

            - secretRef:
                name: app-secret

---
# ============================================================
# BACKEND SERVICE
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: project8-backend-service
spec:
  type: ClusterIP

  selector:
    app: project8-backend

  ports:
    - port: 5000
      targetPort: 5000

---
# ============================================================
# FLASK DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: project8-flask
spec:
  replicas: 2

  selector:
    matchLabels:
      app: project8-flask

  template:
    metadata:
      labels:
        app: project8-flask

    spec:
      containers:
        - name: flask-container
          image: devops-flask-app:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: app-config

            - secretRef:
                name: app-secret

---
# ============================================================
# FLASK SERVICE
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: project8-flask-service
spec:
  type: ClusterIP

  selector:
    app: project8-flask

  ports:
    - port: 5000
      targetPort: 5000

---
# ============================================================
# REDIS DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: project8-redis
spec:
  replicas: 1

  selector:
    matchLabels:
      app: project8-redis

  template:
    metadata:
      labels:
        app: project8-redis

    spec:
      containers:
        - name: redis
          image: redis:latest

          ports:
            - containerPort: 6379

          envFrom:
            - configMapRef:
                name: app-config

---
# ============================================================
# REDIS SERVICE
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: project8-redis-service
spec:
  type: ClusterIP

  selector:
    app: project8-redis

  ports:
    - port: 6379
      targetPort: 6379