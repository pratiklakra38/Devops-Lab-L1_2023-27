apiVersion: apps/v1
kind: Deployment
metadata:
  name: project8-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project8-frontend
  template:
    metadata:
      labels:
        app: project8-frontend
    spec:
      containers:
        - name: frontend
          image: nginx:latest
          ports:
            - containerPort: 80

          volumeMounts:
            - name: frontend-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html

      volumes:
        - name: frontend-html
          configMap:
            name: frontend-html